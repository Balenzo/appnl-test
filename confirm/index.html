<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Moneygames account bevestigd</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0b0b;
      color: #fff;

      font-family: Arial, sans-serif;
    }

    .confirmation-card {
      width: min(420px, calc(100% - 40px));

      padding: 28px 22px;

      background: #111;
      border: 1px solid #242424;
      border-radius: 16px;

      text-align: center;
    }

    .confirmation-icon {
      margin-bottom: 14px;

      font-size: 42px;
    }

    h1 {
      margin: 0 0 12px;

      font-size: 22px;
    }

    p {
      margin: 0;

      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="confirmation-card">

    <div class="confirmation-icon">
      ✅
    </div>

    <h1>
      Account geregistreerd
    </h1>

    <p>
      Je Moneygames-account is succesvol bevestigd.
      Je mag dit venster sluiten en terugkeren naar de Bal Enzo Club App.
    </p>

  </div>

</body>
</html>
